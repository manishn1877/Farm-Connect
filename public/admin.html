<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>FarmConnect admin</title>
<style>
:root{--bg:#eef3ea;--surface:#fff;--surface2:#e4ecdf;--ink:#13281c;--muted:#58705e;--line:#d6e0d0;--brand:#1c6b3e;--brand-ink:#fff;--warn:#a86500;--warn-soft:#fbebc9;--bad:#b0352a;--good:#17803f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1912;--surface:#15251a;--surface2:#1c3123;--ink:#e7f1e4;--muted:#93a998;--line:#27402d;--brand:#52c47f;--brand-ink:#06200f;--warn:#f0b04a;--warn-soft:#3a2d10;--bad:#f08a7e;--good:#52c47f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:max(16px,env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:22px 0 10px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px}
button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}button.dng{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.card b{display:block;font-size:26px}.card small{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{background:var(--surface2);font-weight:600}
.scroll{overflow-x:auto}.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:600}.pill.pending{background:var(--warn-soft);color:var(--warn)}.pill.verified,.pill.done{color:var(--good)}.pill.suspended,.pill.cancelled{color:var(--bad)}
input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.login{max-width:360px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.err{color:var(--bad);margin-top:10px}.muted{color:var(--muted)}.row{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body><div class="wrap" id="app"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},app=$('#app'),tab='overview',me=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(m,u,b){return fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong');return j})})}
function money(n){return '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0})}
function when(t){return new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function loginView(err){
  app.innerHTML='<form class="login" id="lf"><h1>Admin sign in</h1><label for="u">Admin ID or mobile number</label><input id="u" value="ADMIN" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" role="alert">'+esc(err||'')+'</div><p><button class="pri" type="submit">Sign in</button></p></form>';
  $('#lf').onsubmit=function(e){e.preventDefault();api('POST','/api/login',{role:'admin',login:$('#u').value,password:$('#p').value,remember:false}).then(function(j){me=j.user;show()}).catch(function(x){loginView(x.message)})};
}
function shell(inner){
  var tabs=[['overview','Overview'],['sellers','Sellers'],['orders','Orders'],['support','Support'],['listings','Listings']];
  app.innerHTML='<header><h1>FarmConnect admin</h1><button id="out">Sign out</button></header><nav>'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav><div id="body">Loading…</div>';
  $('#out').onclick=function(){api('POST','/api/logout').then(function(){me=null;loginView()})};
  [].forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){tab=b.dataset.t;show()}});
  return $('#body');
}
function fail(el,e){el.innerHTML='<p class="err">'+esc(e.message)+'</p>';if(/sign in/i.test(e.message))loginView()}
function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.join('')||'<tr><td colspan="'+head.length+'" class="muted">Nothing here yet.</td></tr>')+'</tbody></table></div>'}
function show(){
  var el=shell();
  if(tab==='overview')api('GET','/api/admin/summary').then(function(s){
    var c=[['Customers',s.customers],['Sellers waiting for approval',s.sellersPending],['Approved sellers',s.sellersVerified],['Live listings',s.products],['Orders today',s.ordersToday],['Open orders',s.ordersOpen],['Completed sales',money(s.sales)],['Open support messages',s.ticketsOpen]];
    el.innerHTML='<div class="cards">'+c.map(function(x){return '<div class="card"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>'}).join('')+'</div>';
  }).catch(function(e){fail(el,e)});
  if(tab==='sellers')api('GET','/api/admin/sellers').then(function(r){
    el.innerHTML='<p class="muted">New sellers stay hidden from customers until you approve them. Check their phone, farm and FSSAI number first.</p>'+table(['Farmer ID','Farm','Owner','Contact','FSSAI','Listings','Status','Action'],r.sellers.map(function(s){
      return '<tr><td>'+esc(s.loginId)+'</td><td>'+esc(s.farm.farm)+'<br><small class="muted">'+esc(s.farm.area)+'</small></td><td>'+esc(s.name)+'</td><td>'+esc(s.phone)+'<br><small class="muted">'+esc(s.email)+'</small></td><td>'+esc(s.farm.fssai||'None')+'</td><td>'+s.listings+'</td><td><span class="pill '+s.status+'">'+s.status+'</span></td><td class="row">'+
       (s.status!=='verified'?'<button class="pri" data-s="'+s.id+'" data-v="verified">Approve</button>':'')+(s.status!=='suspended'?'<button class="dng" data-s="'+s.id+'" data-v="suspended">Suspend</button>':'')+'</td></tr>'}));
    [].forEach.call(el.querySelectorAll('button[data-s]'),function(b){b.onclick=function(){api('POST','/api/admin/sellers/'+b.dataset.s,{status:b.dataset.v}).then(show).catch(function(e){fail(el,e)})}});
  }).catch(function(e){fail(el,e)});
  if(tab==='orders')api('GET','/api/admin/orders').then(function(r){
    el.innerHTML=table(['Ref','When','Customer','Items','Total','Payment','Status','Action'],r.orders.map(function(o){
      var open=['awaiting_payment','new','accepted','ready'].indexOf(o.status)>-1;
      return '<tr><td>'+esc(o.ref)+'<br><small class="muted">'+esc(o.type)+'</small></td><td>'+when(o.createdAt)+'</td><td>'+esc(o.name)+'<br><small class="muted">'+esc(o.phone)+'</small></td><td>'+o.items.map(function(i){return esc(i.name)+' × '+i.qty}).join('<br>')+'</td><td>'+money(o.total)+'</td><td>'+esc(o.payMethod)+' · '+esc(o.payStatus)+'</td><td><span class="pill '+o.status+'">'+esc(o.status.replace('_',' '))+'</span></td><td>'+(open?'<button class="dng" data-c="'+o.id+'">Cancel and refund</button>':'')+'</td></tr>'}));
    [].forEach.call(el.querySelectorAll('button[data-c]'),function(b){b.onclick=function(){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Sure? Click again';return}api('POST','/api/admin/orders/'+b.dataset.c+'/cancel').then(show).catch(function(e){fail(el,e)})}});
  }).catch(function(e){fail(el,e)});
  if(tab==='support')api('GET','/api/admin/tickets').then(function(r){
    el.innerHTML=table(['Ticket','When','From','Message','Status','Reply'],r.tickets.map(function(t){
      return '<tr><td>'+esc(t.id)+'<br><small class="muted">'+esc(t.ref)+'</small></td><td>'+when(t.at)+'</td><td>'+esc(t.name)+'<br>'+esc(t.phone)+'<br>'+esc(t.email)+'</td><td>'+esc(t.message)+'</td><td><span class="pill '+(t.status==='open'?'pending':'done')+'">'+t.status+'</span></td><td><input aria-label="Note for '+esc(t.id)+'" data-r="'+t.id+'" value="'+esc(t.reply)+'" placeholder="Note, then close"><div class="row" style="margin-top:6px"><button class="pri" data-t="'+t.id+'" data-st="closed">Close</button><button data-t="'+t.id+'" data-st="open">Reopen</button></div></td></tr>'}));
    [].forEach.call(el.querySelectorAll('button[data-t]'),function(b){b.onclick=function(){api('POST','/api/admin/tickets/'+b.dataset.t,{status:b.dataset.st,reply:el.querySelector('input[data-r="'+b.dataset.t+'"]').value}).then(show).catch(function(e){fail(el,e)})}});
  }).catch(function(e){fail(el,e)});
  if(tab==='listings')api('GET','/api/admin/products').then(function(r){
    el.innerHTML=table(['ID','Product','Seller','Price','Stock','Action'],r.products.map(function(p){return '<tr><td>'+p.id+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.farmer)+'</td><td>'+money(p.price)+' / '+esc(p.unit)+'</td><td>'+p.qty+'</td><td><button class="dng" data-d="'+p.id+'">Remove</button></td></tr>'}));
    [].forEach.call(el.querySelectorAll('button[data-d]'),function(b){b.onclick=function(){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Sure? Click again';return}api('DELETE','/api/admin/products/'+b.dataset.d).then(show).catch(function(e){fail(el,e)})}});
  }).catch(function(e){fail(el,e)});
}
api('GET','/api/me').then(function(j){if(j.user&&j.user.role==='admin'){me=j.user;show()}else loginView()}).catch(function(){loginView()});
})();
</script></body></html>
