  var d={};[].forEach.call(f.elements,function(el){if(!el.name)return;if((el.type==='radio'||el.type==='checkbox')&&!el.checked)return;d[el.name]=el.value});
  if(kind==='place')placeOrder(f,d);
  if(kind==='product'&&isFarmer())saveProduct(d);
  if(kind==='market'&&isFarmer())saveMarket(d);
  if(kind==='gsearch'){S.ui.gq=(d.q||'').trim();S.ui.gcat='All';S.ui.view='search';render()}
  if(kind==='login')doLogin('customer',d);
  if(kind==='flogin')doLogin('farmer',d);
  if(kind==='register')doRegisterCustomer(d);
  if(kind==='fregister')doRegisterFarmer(d);
  if(kind==='reset')doReset(d);
  if(kind==='chpw')doChangePw(d);
  if(kind==='cprofile')saveCustomerProfile(d);
  if(kind==='fprofile')saveFarmerProfile(d);
  if(kind==='review')submitReview(d);
  if(kind==='pay')payNow(d);
  if(kind==='otp'&&L.code)L.code.submit((d.code||'').trim());
  if(kind==='support')L.support(f,d);
  if(kind==='delacct')L.delAcctSubmit(d);
});
function placeOrder(f,d){
  if(!isCustomer()){S.ui.after='checkout';S.ui.view='auth';render();return}
  var err=$('#formErr');function bad(m,id){err.textContent=m;err.hidden=false;var el=$('#'+id);if(el&&el.focus)el.focus()}
  var lines=cartLines();
  if((S.cart.pending||[]).length){toast('Choose a product for every item in your basket first.',true);return}
  if(!lines.length){toast('Your basket is empty.',true);return}
  var name=(d.name||'').trim(),phone=(d.phone||'').replace(/[\s-]/g,''),addr=(d.address||'').trim(),pin=(d.pin||'').trim();
  if(!name)return bad('Enter your name so the seller knows who to expect.','cName');
  if(!/^(\+91|91|0)?[6-9]\d{9}$/.test(phone))return bad('Enter a valid 10-digit Indian mobile number.','cPhone');
  if(S.ui.mode==='delivery'){
    if(!addr)return bad('Enter a delivery address.','cAddr');
    if(!/^\d{6}$/.test(pin))return bad('Enter a 6-digit pincode.','cPin');
    if(cartSub()<SITE.minDelivery)return bad('Delivery needs a basket of at least '+money(SITE.minDelivery)+'. Add more produce or choose pickup.','cAddr');
  }
  if(!d.terms)return bad('Please accept the terms to place your request.','cTerms');
  if(LIVE)return L.placeOrder(f,d,lines,bad);
  var short=null;
  lines.forEach(function(l){if(!short&&l.qty>l.p.qty+1e-9)short=l});
  if(short){var sp=short.p;S.cart.items=S.cart.items.filter(function(x){var p=prod(x.id);return p&&p.qty>0});S.cart.items.forEach(function(x){var p=prod(x.id);if(x.qty>p.qty)x.qty=p.qty});save();render(true);toast('Stock for '+sp.name+' changed while you were shopping. Your basket was adjusted.',true);return}
  var items=lines.map(function(l){return{ownerId:l.p.ownerId||null,pid:l.p.id,name:l.p.name,emoji:l.p.emoji,qty:l.qty,unit:l.p.unit,price:l.p.price}});
  var sub=cartSub(),fee=feeFor(S.ui.mode,sub),now=new Date().toISOString();
  var online=S.ui.pay==='online';
  var ownerIds=[];lines.forEach(function(l){if(l.p.ownerId&&ownerIds.indexOf(l.p.ownerId)<0)ownerIds.push(l.p.ownerId)});
  var o={id:uid(),uid:SES.uid,ownerIds:ownerIds,ref:'FC-'+Math.random().toString(36).slice(2,8).toUpperCase(),mine:true,demo:false,reviewed:false,type:S.ui.mode,marketId:S.cart.marketId,items:items,subtotal:sub,fee:fee,total:r2(sub+fee),
    name:name,phone:(d.phone||'').trim(),address:S.ui.mode==='delivery'?addr+', '+pin:'',date:d.date,slot:d.slot,note:(d.note||'').trim(),status:online?'awaiting':'new',payMethod:online?'online':'cod',payStatus:online?'pending':'cod',createdAt:now,updatedAt:now,events:[{s:online?'awaiting':'new',at:now}]};
  lines.forEach(function(l){l.p.qty=Math.round((l.p.qty-l.qty)*1000)/1000});
  if(d.remember&&isCustomer()){var ca=me();ca.address=addr||ca.address||'';ca.pin=pin||ca.pin||''}
  S.orders.push(o);S.cart={marketId:null,items:[]};
  if(!online)noteOwners(o,'New '+o.type+' request','From '+name+': '+items.length+' item'+(items.length===1?'':'s')+', '+money(o.total)+'. Reference '+o.ref+'.');
  if(!online)addNote(o.uid,'Request sent','Order '+o.ref+' is waiting for the seller to accept it.');
  save();
  S.ui.view='orders';render();
  if(online){openPay(o.id);return}
  openModal('<svg class="okmark" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M24 41l11 11 21-23"/></svg><h3 style="text-align:center">Request sent</h3><p class="muted" style="text-align:center">Your '+(o.type==='pickup'?'pickup reservation':'delivery request')+' is with the seller. Pay '+money(o.total)+' on '+(o.type==='pickup'?'pickup':'delivery')+'.</p><div class="refbox"><span class="muted">Reference</span><b class="mono">'+esc(o.ref)+'</b></div><div class="refbox"><span class="muted">Total</span><b class="mono">'+money(o.total)+'</b></div><div class="mact" style="justify-content:center"><button class="btn" data-a="closeModal">View my orders</button></div>');
}

/* ---------- history (back button) ---------- */
var lastSig=null;
function sigNow(){var u=S.ui;return [u.role,u.view,u.marketId,u.page,u.ftab,u.atab,u.ptab].join('|')}
function snapUI(){var u=S.ui;return{role:u.role,view:u.view,marketId:u.marketId,page:u.page,ftab:u.ftab,atab:u.atab,ptab:u.ptab}}
function historySync(){
  var s=sigNow();if(s===lastSig)return;
  var first=lastSig===null;lastSig=s;
  try{if(first)history.replaceState({fc:snapUI()},'');else history.pushState({fc:snapUI()},'')}catch(e){}
}
function titleFor(){
  var base='FarmConnect',u=S.ui;
  if(u.role==='farmer')return (isFarmer()?'Seller workspace':'Farmer portal')+' · '+base;
  if(u.view==='shop'){var m=mkt(u.marketId);return (m?m.name+' · ':'')+base}
  var t={search:'Find produce',orders:'My orders',account:'Account',auth:'Sign in or register',checkout:'Checkout'}[u.view];
  if(u.view==='page'){var pg=PAGES[u.page];t=pg?pg.t:null}
  return t?t+' · '+base:base+' · Fresh produce near you';
}

function saveProduct(d){
  var price=Number(d.price),qty=Number(d.qty),online=d.online?Number(d.online):null;
  if(!(price>0)||!(qty>=0)){toast('Check the price and quantity.',true);return}
  var old=S.ui.editId?prod(S.ui.editId):null;
  var id=old?old.id:(S.products.reduce(function(m,p){return Math.max(m,Number(p.id)||0)},0)+1);
  var item={id:id,farmer:d.farmer.trim(),name:d.name.trim(),category:d.category,emoji:(d.emoji||'').trim()||guess(d.name),price:price,unit:d.unit,qty:qty,onlinePrice:online,onlineRetailer:(d.retailer||'').trim()||(online?'Online retailer':''),marketId:d.marketId,description:(d.description||'').trim()};
  if(old&&!ownsProduct(old)){toast('You can only edit your own listings.',true);return}
  if(LIVE)return L.saveProduct(d,old,price,qty,online);
  item.ownerId=me().id;item.updatedAt=new Date().toISOString();item.photo=PH.product!==undefined?(PH.product||''):((old&&old.photo)||'');PH.product=undefined;
  if(old)S.products=S.products.map(function(p){return p.id===id?item:p});else S.products.unshift(item);
  S.ui.editId=null;S.ui.ftab='products';save();render(true);toast(old?'Listing updated.':'Product added. Customers can see it at '+(mkt(item.marketId)||{name:'its market'}).name+'.');
}
function guess(n){n=n.toLowerCase();var m=[['tomato','🍅'],['carrot','🥕'],['banana','🍌'],['spinach','🥬'],['leaf','🥬'],['ragi','🌾'],['rice','🌾'],['bean','🫛'],['apple','🍎'],['mango','🥭'],['onion','🧅'],['potato','🥔'],['corn','🌽'],['coconut','🥥'],['brinjal','🍆'],['chilli','🌶️'],['lemon','🍋']];for(var i=0;i<m.length;i++)if(n.indexOf(m[i][0])>-1)return m[i][1];return '🌱'}
function saveMarket(d){
  if(!S.ui.pin){toast('Click the map to drop a pin first.',true);return}
  var name=d.name.trim(),old=S.markets.filter(function(m){return m.name.toLowerCase()===name.toLowerCase()})[0];
  if(old&&old.ownerId!==me().id){toast(old.name+' already exists. Choose a different name.',true);return}
  if(LIVE)return L.saveMarket(d,old);
  var item={ownerId:me().id,id:old?old.id:'m'+Date.now(),name:name,area:(d.area||'').trim()||name,hours:(d.hours||'').trim()||'Hours not verified',contact:(d.contact||'').trim(),lat:S.ui.pin.lat,lng:S.ui.pin.lng};
  if(old)S.markets=S.markets.map(function(m){return m.id===old.id?item:m});else S.markets.push(item);
  S.ui.pin=null;save();render(true);toast('Market pin saved. Customers can choose it now.');
}

/* ---------- live mode: the website talks to the FarmConnect server (only when the server serves this page) ---------- */
var L={sig:'',code:null,placing:false};
function apiCall(method,url,body){
  var o={method:method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};if(body!==undefined)o.body=JSON.stringify(body);
  return fetch(url,o).then(function(r){
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var e=new Error(j.error||'Something went wrong. Please try again.');e.status=r.status;throw e}
      return j;
    });
  },function(){var e=new Error('We could not reach the server. Check your connection and try again.');e.status=0;throw e});
}
L.acct=function(u){return{id:u.id,role:u.role,name:u.name,phone:u.phone,email:u.email||'',loginId:u.loginId,address:u.address||'',pin:u.pin||'',farm:u.farm?Object.assign({},u.farm,{photo:u.photoV?'/api/photo/farm/'+u.id+'?v='+u.photoV:''}):null,status:u.status,created:u.created||new Date().toISOString()}};
L.stIn=function(s){return s==='awaiting_payment'?'awaiting':s};
L.order=function(o){
  o.status=L.stIn(o.status);o.events=(o.events||[]).map(function(e){return{s:L.stIn(e.s),at:e.at}});o.mine=true;o.demo=false;
  o.items.forEach(function(i){i.emoji=i.emoji||'🌱'});return o;
};
L.load=function(){
  return apiCall('GET','/api/me').then(function(j){
    var u=j.user&&j.user.role!=='admin'?j.user:null;
    var jobs=[apiCall('GET','/api/catalog'),u?(u.role==='farmer'?apiCall('GET','/api/farmer/orders'):apiCall('GET','/api/orders')):Promise.resolve({orders:[]}),u?apiCall('GET','/api/notes'):Promise.resolve({notes:[]})];
    return Promise.all(jobs).then(function(r){
      var sig=JSON.stringify([u,r[0],r[1],r[2]]),changed=sig!==L.sig;
      if(changed){
        L.sig=sig;S.accounts=u?[L.acct(u)]:[];SES.uid=u?u.id:null;
        S.markets=r[0].markets;S.products=r[0].products;S.reviews=r[0].reviews||[];S.farmers=r[0].farmers||[];S.products.forEach(function(p){p.photo=p.photoV?'/api/photo/product/'+p.id+'?v='+p.photoV:''});
        S.orders=r[1].orders.map(L.order);S.notes=r[2].notes;
        S.cart.items=S.cart.items.filter(function(l){return prod(l.id)});if(!S.cart.items.length&&!(S.cart.pending||[]).length)S.cart.marketId=null;
        if(S.ui.marketId&&!mkt(S.ui.marketId)){S.ui.marketId=null;if(S.ui.view==='shop')S.ui.view='markets'}
      }
      return changed;
    });
  });
};
L.refresh=function(){return L.load().then(function(){updateBadges();render(true)})};
L.poll=function(){
  if(document.hidden||L.placing)return;
  L.load().then(function(ch){
    if(!ch)return;updateBadges();
    var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if($('#modal.on')||$('#drawer.on')||typing||S.ui.view==='checkout'||S.ui.view==='auth'||(S.ui.role==='farmer'&&S.ui.ftab==='add'))return;
    render(true);
  }).catch(function(){});
};
L.boot=function(){
  L.pages();
  $('#app').innerHTML='<div class="wrap" style="padding-block:90px;text-align:center" role="status"><div class="spinner" style="margin:0 auto 14px;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite"></div><p class="muted">Loading markets near you...</p></div>';
  L.load().then(function(){
    render();setInterval(L.poll,20000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)L.poll()});
  }).catch(function(e){
    $('#app').innerHTML='<div class="wrap" style="padding-block:80px;max-width:560px"><h2 style="font-size:34px">We could not load FarmConnect</h2><p class="muted" style="margin:12px 0 20px">'+esc(e.message)+'</p><button class="btn" data-a="reload">Try again</button></div>';
  });
};

  });

/* accounts */
L.register=function(role,d){
  var phone=normPhone(d.phone);
  function go(code){
    busy(true);
    var body={role:role,password:d.password,terms:1,phone:phone,email:(d.email||'').trim(),otp:code};
    if(role==='farmer'){body.farm=d.farm;body.owner=d.owner;body.area=d.area;body.grow=d.grow;body.marketId=d.marketId;body.fssai=d.fssai}else body.name=d.name;
    apiCall('POST','/api/register',body).then(function(j){
      S.accounts=[L.acct(j.user)];SES.uid=j.user.id;L.sig='';
      return L.load().then(function(){
        var a=me();closeModal();
        if(role==='farmer'){
          S.ui.role='farmer';S.ui.ftab='add';S.ui.editId=null;S.ui.after=null;render();
          openModal('<svg class="okmark" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M24 41l11 11 21-23"/></svg><h3 style="text-align:center">Welcome, '+esc(firstName(a))+'</h3><p class="muted" style="text-align:center">Your Farmer ID is your login. Keep it somewhere safe. You can sign in with it, or with your email or mobile number.</p><div class="idbox"><span class="mono" id="newFid">'+esc(a.loginId)+'</span><button class="btn sm" type="button" data-a="copyText" data-t="'+esc(a.loginId)+'">Copy</button></div>'+(a.status==='pending'?'<p class="muted" style="text-align:center;margin-top:10px">We check every new seller. You can add your products now, and customers see them once your account is approved.</p>':'')+'<div class="mact" style="justify-content:center"><button class="btn" data-a="closeModal">Add my first product</button></div>');
        }else afterAuth('Welcome to FarmConnect, '+firstName(a)+'.');
      });
    }).catch(function(e){authBad(e.message,role==='farmer'?'pPhone':'rPhone')});
  }
  if(!BOOT.otp)return go('');
  busy(true);
  L.askCode(phone,'register','Confirm your mobile number','We sent a 6-digit code by SMS to '+phone+'.',go).then(function(){busy(false)});

    S.accounts=[L.acct(j.user)];SES.uid=j.user.id;L.sig='';

L.reset=function(d){
  var role=d.role==='farmer'?'farmer':'customer',phone=normPhone(d.phone);
  if(!(d.login||'').trim())return authBad('Enter your '+(role==='farmer'?'Farmer ID':'mobile number or email')+'.','xLogin');
  if(!validPhone(d.phone))return authBad('Enter the 10-digit mobile number on the account.','xPhone');
  var pe=pwProblem(d.password||'');if(pe)return authBad(pe,'xPass');
  if(d.password!==d.confirm)return authBad('The two passwords do not match.','xConfirm');
  L.askCode(phone,'reset','Enter your code','If those details match an account, we sent a 6-digit code by SMS to '+phone+'.',function(code){
    apiCall('POST','/api/reset',{role:role,login:d.login.trim(),phone:phone,otp:code,password:d.password}).then(function(){closeModal();toast('Password changed. Sign in with your new password.')}).catch(function(e){authBad(e.message,'otpCode')});
  });
};
L.saveCustomer=function(a,v,near){

/* orders and payment */
L.placeOrder=function(f,d,lines,bad){
  if(L.placing)return;L.placing=true;
  var btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  var addr=(d.address||'').trim(),pin=(d.pin||'').trim(),online=S.ui.pay==='online';
  apiCall('POST','/api/orders',{type:S.ui.mode,payMethod:online?'online':'cod',name:(d.name||'').trim(),phone:d.phone,address:addr,pin:pin,slot:d.slot,date:d.date,note:(d.note||'').trim(),terms:1,items:lines.map(function(l){return{id:l.p.id,qty:l.qty}})}).then(function(j){
    if(d.remember&&isCustomer()){var a=me();apiCall('POST','/api/me',{name:a.name,phone:a.phone,email:a.email,address:addr||a.address,pin:pin||a.pin}).catch(function(){})}
    S.cart={marketId:null,items:[]};save();
    return L.load().then(function(){
      L.placing=false;S.ui.view='orders';render();
      if(j.payment){L.pay(j.order.id,j.payment);return}
      openModal('<svg class="okmark" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M24 41l11 11 21-23"/></svg><h3 style="text-align:center">Request sent</h3><p class="muted" style="text-align:center">Your '+(S.ui.mode==='pickup'?'pickup reservation':'delivery request')+' is with the seller. Pay '+money(j.order.total/100)+' on '+(S.ui.mode==='pickup'?'pickup':'delivery')+'.</p><div class="refbox"><span class="muted">Reference</span><b class="mono">'+esc(j.order.ref)+'</b></div><div class="refbox"><span class="muted">Total</span><b class="mono">'+money(j.order.total/100)+'</b></div><div class="mact" style="justify-content:center"><button class="btn" data-a="closeModal">View my orders</button></div>');
    });

function kPrefix(w){
  if(!/[ಀ-೿]/.test(w))return null;
  for(var L=w.length-1;L>=3;L--){var k=w.slice(0,L),v=TR[k];if(v!=null&&KSUF.test(w.slice(L)))return v}

}
/* turns a Hindi or Kannada sentence into English words; English text passes through unchanged */
function nativeToEn(s){
  s=String(s||'');if(!NATIVE.test(s))return s;
  s=nfx(s).replace(/[०-९೦-೯]/g,function(c){return NUMD[c]}).replace(/[।॥,.?!;:()"“”]/g,' ');
  var w=s.split(/\s+/).filter(Boolean),out=[],i=0;
  while(i<w.length){
    var done=false;
    for(var L=Math.min(TRK,w.length-i);L>=1&&!done;L--){
      var ph=w.slice(i,i+L).join(' '),hit=TR[ph];
      if(hit==null&&L===1&&NATIVE.test(ph))hit=kPrefix(ph);
      if(hit!=null){if(hit)out.push(hit);i+=L;done=true}
    }
    if(!done){if(!NATIVE.test(w[i]))out.push(w[i]);i++}
  }
  return out.join(' ');
}

/* ----- finding the market in what was said ----- */
function findMarket(ns,used){
  var best=null;
  S.markets.forEach(function(m){
    var all=ntok(m.name),key=all.filter(function(w){return !MKSTOP[w]});if(!key.length)key=all;
    var vars=[[key,60],[[key.join('')],60]];
    if(key.length>1&&key[0].length>=6)vars.push([[key[0]],0]);
    var a=ntok((m.area||'').split(',')[0]);if(a.length)vars.push([a,0]);
    vars.forEach(function(v){
      var i=findSeq(ns,v[0],used);if(i<0)return;
      var sc=v[0].join('').length+v[1],d=isFinite(m.lat)?dist(m):0;
      if(!best||sc>best.sc||(sc===best.sc&&d<best.d))best={m:m,sc:sc,d:d,i:i,len:v[0].length};
    });
  });
  if(best)for(var k=0;k<best.len;k++)used[best.i+k]=true;
  return best?best.m:null;
}

    if(used[i]){i++;continue}
    var hit=false;
    for(var len=3;len>=1&&!hit;len--){
      if(i+len>T.length)continue;
      var seg=ns.slice(i,i+len),free=true;for(var k=0;k<len;k++)if(used[i+k])free=false;if(!free)continue;
      var ph=seg.join(' '),d=DM[ph];
      if(d){
        if(dishes.indexOf(d)<0)dishes.push(d);
        for(var k2=0;k2<len;k2++)used[i+k2]=true;i+=len;hit=true;
      }else if(V[ph]){
        var qq=parseQty(T,i,i+len),kw=V[ph];
        addNeed(kw.join(' '),kw,titleCase(T.slice(i,i+len).map(function(t){return t.r}).join(' ')),'',qq.q,qq.u);
        for(var k3=0;k3<len;k3++)used[i+k3]=true;i+=len;hit=true;
      }
    }
    if(!hit)i++;
  }
  dishes.forEach(function(d){d.ing.forEach(function(g){var kw=ntok(g);addNeed(kw.join(' '),kw,g,d.n)})});
  return {mk:mk,needs:needs,dishes:dishes};
}

/* ----- matching what was asked against one market's stock ----- */
function stockAt(m,kw){return S.products.filter(function(p){return p.marketId===m.id&&hasAll(ntok(p.name),kw)})}
function sortOpts(list,label){
  var said=' '+String(label||'').toLowerCase()+' ';
  function pen(p){var n=p.name.toLowerCase(),r=/\b(raw|flower|stem|dry|tender|leaves|baby|cherry|button|red)\b/.exec(n);return r&&said.indexOf(' '+r[1]+' ')<0?1:0}
  var lab=ntok(label).join(' ');
  function ex(p){return ntok(p.name).join(' ')===lab?0:1}
  return list.slice().sort(function(a,b){return ex(a)-ex(b)||pen(a)-pen(b)||a.price-b.price});
}
function findAlt(m,kw){
  var ms=sortedMarkets();
  for(var i=0;i<ms.length;i++){if(ms[i].id===m.id)continue;if(stockAt(ms[i],kw).some(function(p){return p.qty>0}))return {id:ms[i].id,name:ms[i].name,km:Math.round(ms[i]._d*10)/10}}
  return null;
}
function pickQty(nd,p){
  var q=null;

    if(nd.u){if(nd.u===p.unit)q=nd.q}
    else if(p.unit==='piece'||p.unit==='bunch')q=nd.q;
  }

function openNow(m){

  function mins(h,mi,ap){h=+h%12;if(/p/i.test(ap))h+=12;return h*60+(+mi||0)}
  var a=mins(r[1],r[2],r[3]),b=mins(r[4],r[5],r[6]),d=new Date(),n=d.getHours()*60+d.getMinutes();
  var open=a<=b?(n>=a&&n<b):(n>=a||n<b);

function botApply(m,needs){

function botHandle(text){

  if(BOT.ask||BOT.confirm){
    if(/^(yes|yeah|yep|yup|ok|okay|sure|confirm|do it|go ahead|please do)\b/.test(yn)){if(BOT.ask)A.botYes();else A.botNew();return}
    if(/^(no|nope|nah|cancel|do not|don't|stop)\b/.test(yn)){if(BOT.ask)A.botNo();else A.botKeep();return}
  }
  if(P.mk)BOT.marketId=P.mk.id;

  var mid=BOT.marketId||S.cart.marketId,m=mid?mkt(mid):null;
  if(!needs.length){
    if(P.mk){botSay('Okay, '+P.mk.name+'. What do you need? Say the items, or a dish you want to cook.',botListen);return}
    botSay("I didn't catch any produce or dish. Try: I'm going to Gandhi Bazaar, I need banana and watermelon. Or: I want to make upma.");return;
  }
  if(!m){
    BOT.queued={needs:needs,dishes:dishes};BOT.askMarket=true;
    botSay('Which market are you going to?',botListen);return;
  }
  botRun(m,needs,dishes);
}
