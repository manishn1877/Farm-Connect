<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FarmConnect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap">
<style>
/* Layout concept: a market-day app. Left column leads with the shopping task, a schematic Bengaluru map anchors the first screen, and the farmer workspace reuses the same surfaces as a ledger of requests and stock. */
:root{
  --bg:#eef3ea; --surface:#ffffff; --surface2:#e4ecdf; --ink:#13281c; --muted:#58705e; --line:#d6e0d0;
  --brand:#1c6b3e; --brand-ink:#ffffff; --brand-soft:#d8ecd5;
  --accent:#f2b51d; --accent-ink:#3a2a00;
  --good:#17803f; --warn:#a86500; --bad:#b0352a; --bad-soft:#f6dcd8; --warn-soft:#fbebc9;
  --map-land:#e3ecd9; --map-road:#ffffff; --map-water:#bfdcea; --map-park:#cfe5c3;
  --leaf:#2f9e5b; --leaf-soft:#dff3e2; --mango:#f08a24; --mango-soft:#fde8cf; --tomato:#d9483b; --tomato-soft:#fadcd6; --berry:#8a3f8f; --berry-soft:#f0e0f1; --sky:#2a7fb8; --sky-soft:#dcecf7; --lime:#8cbf2f; --lime-soft:#ecf5cf;
  --shadow:0 1px 2px rgba(19,40,28,.06),0 10px 30px rgba(19,40,28,.07);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1912; --surface:#15251a; --surface2:#1c3123; --ink:#e7f1e4; --muted:#93a998; --line:#27402d;
  --brand:#52c47f; --brand-ink:#06200f; --brand-soft:#1d3a28;
  --accent:#f3c04a; --accent-ink:#2e2200;
  --good:#52c47f; --warn:#f0b04a; --bad:#f08a7e; --bad-soft:#3d1f1c; --warn-soft:#3a2d10;
  --map-land:#172a1d; --map-road:#243a2b; --map-water:#1c3a4a; --map-park:#1d3a26;
  --leaf:#6fd496; --leaf-soft:#1d3a28; --mango:#f4a04a; --mango-soft:#3d2a12; --tomato:#f27a6c; --tomato-soft:#3d1f1c; --berry:#d68ade; --berry-soft:#33203a; --sky:#6db6e8; --sky-soft:#17303f; --lime:#b6dd5c; --lime-soft:#2a3512;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1912; --surface:#15251a; --surface2:#1c3123; --ink:#e7f1e4; --muted:#93a998; --line:#27402d;
  --brand:#52c47f; --brand-ink:#06200f; --brand-soft:#1d3a28;
  --accent:#f3c04a; --accent-ink:#2e2200;
  --good:#52c47f; --warn:#f0b04a; --bad:#f08a7e; --bad-soft:#3d1f1c; --warn-soft:#3a2d10;
  --map-land:#172a1d; --map-road:#243a2b; --map-water:#1c3a4a; --map-park:#1d3a26;
  --leaf:#6fd496; --leaf-soft:#1d3a28; --mango:#f4a04a; --mango-soft:#3d2a12; --tomato:#f27a6c; --tomato-soft:#3d1f1c; --berry:#d68ade; --berry-soft:#33203a; --sky:#6db6e8; --sky-soft:#17303f; --lime:#b6dd5c; --lime-soft:#2a3512;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:650;transition:transform .15s,filter .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 16px rgba(28,107,62,.25)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.icon:hover{background:var(--surface2)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px var(--f-display);letter-spacing:-.03em;color:var(--ink)}
.brand .ic{width:34px;height:34px;padding:7px;border-radius:11px;background:var(--brand);color:var(--brand-ink)}
.nav{display:flex;gap:4px;margin-left:14px}
.nav button{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.nav button:hover:not(.on){background:var(--surface2)}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px}
.basketbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.basketbtn b,.pill-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent-ink);color:var(--accent);font:600 11px var(--f-mono)}
.pill-n{background:var(--accent);color:var(--accent-ink)}
.pill-n[hidden]{display:none}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tabbar{display:none}

/* page transitions */
main{padding-block:26px 70px;min-height:70vh}
.view{animation:viewIn .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* hero / markets */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(38px,5.6vw,68px);font-weight:800;margin:14px 0 14px;line-height:.98}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
.hero h1 em:after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.16em;background:var(--accent);border-radius:99px;transform-origin:left;animation:grow .9s .5s cubic-bezier(.2,.7,.2,1) both;z-index:-1}
@keyframes grow{from{transform:scaleX(0)}}
.hero p.lead{font-size:17px;color:var(--muted);max-width:46ch}
.locrow{display:flex;gap:10px;align-items:center;margin:22px 0 14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.field small{color:var(--muted);font-size:12px}
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.mrow:hover,.mrow.hl{transform:translateX(4px);border-color:var(--brand);box-shadow:var(--shadow)}
.mnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font:600 14px var(--f-mono)}
.mrow strong{display:block;font:700 16px var(--f-display)}
.mrow small{color:var(--muted);display:block;line-height:1.35}
.mrow .dist{font:500 13px var(--f-mono);text-align:right;color:var(--brand)}
.mrow .dist span{display:block;color:var(--muted);font-size:11px}

/* map */
.mapcard{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.mapcard svg{display:block;width:100%;height:auto}
.mapcap{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap}
.pin{cursor:pointer}
.pin .drop{animation:drop .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*90ms + 300ms);transform-box:fill-box;transform-origin:50% 100%}
@keyframes drop{from{opacity:0;transform:translateY(-26px) scale(.6)}}
.pin:hover .drop,.pin.hl .drop{transform:scale(1.18)}
.pin .drop{transition:transform .2s}
.you-ring{animation:ping 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.maplabel{font:600 10px var(--f-body);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* shop */
.shophead{display:flex;gap:18px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin:14px 0 22px}
.shophead h2{font-size:clamp(28px,4vw,44px);font-weight:800}
.meta{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.meta span{display:inline-flex;gap:6px;align-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;padding:12px 13px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0;max-width:100%}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted);transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .22s,box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.card.enter{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.art{height:128px;display:grid;place-items:center;font-size:62px;position:relative;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c,#7bc47f) 38%,var(--surface)),var(--surface2))}
.art span{filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.card:hover .art span{transform:scale(1.14) rotate(-6deg)}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .2s}
.heart:hover{transform:scale(1.12)}
.heart.on{color:var(--bad)}.heart.on .ic{fill:currentColor}
.heart.pop{animation:bump .4s}
.cbody{padding:15px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.stock{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.stock.low{color:var(--warn)}.stock.out{color:var(--bad)}
.card h4{font-size:19px}
.price{font:500 22px var(--f-mono);letter-spacing:-.03em}
.price small{font-size:12px;color:var(--muted);letter-spacing:0}
.save{font-size:12px;padding:7px 10px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:600;line-height:1.35}
.save.bad{background:var(--warn-soft);color:var(--warn)}
.by{font-size:13px;color:var(--muted)}
.buyrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.link{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.link:hover{color:var(--brand)}
.addbtn{padding:9px 20px;border-radius:11px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;background:var(--surface);transition:all .15s}
.addbtn:hover:not(:disabled){background:var(--brand);color:var(--brand-ink)}
.addbtn:disabled{opacity:.4;cursor:not-allowed}
.step{display:inline-flex;align-items:center;border-radius:11px;background:var(--brand);color:var(--brand-ink);overflow:hidden}
.step button{width:34px;height:36px;display:grid;place-items:center;color:inherit}
.step button:hover{background:rgba(255,255,255,.18)}
.step b{min-width:26px;text-align:center;font:500 14px var(--f-mono)}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;border:1.5px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin:10px 0 6px}
.empty .big{font-size:46px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(6,20,10,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:90;background:var(--surface);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 50px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:24px}
.dbody{flex:1;overflow:auto;padding:6px 20px}
.dfoot{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:12px}
.line{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.lart{width:48px;height:48px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:27px}
.line strong{display:block;font-weight:650;overflow-wrap:anywhere}
.line .step{background:var(--surface2);color:var(--ink)}
.line .step button:hover{background:var(--line)}
.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sumrow.total{font:700 18px var(--f-display);padding-top:12px;border-top:1px solid var(--line)}
.sumrow.total .mono{font-size:22px;color:var(--brand)}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal.on{pointer-events:auto}
.mbox{background:var(--surface);border-radius:24px;padding:26px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(24px) scale(.96);opacity:0;transition:all .3s cubic-bezier(.2,.8,.2,1)}
.modal.on .mbox{transform:none;opacity:1}
.mbox h3{font-size:26px;margin-bottom:8px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.cmp{display:grid;gap:12px;margin:18px 0}
.cmpbar{display:grid;gap:6px}
.cmpbar .lab{display:flex;justify-content:space-between;font-size:13px}
.track{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--brand);transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.fill.alt{background:var(--accent)}
.okmark{width:76px;height:76px;margin:0 auto 14px;display:block}
.okmark circle{fill:var(--brand-soft);stroke:var(--brand);stroke-width:3;stroke-dasharray:240;stroke-dashoffset:240;animation:dash .7s forwards}
.okmark path{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dash .5s .55s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.refbox{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface2);margin-top:12px;font-size:14px}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.5vw,26px);box-shadow:var(--shadow)}
.panel h3{font-size:22px;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.fgrid .full{grid-column:1/-1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mode{text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:grid;gap:6px;transition:all .18s;position:relative}
.mode:hover{border-color:var(--brand)}
.mode.on{border-color:var(--brand);background:var(--brand-soft)}
.mode .ic{width:26px;height:26px;color:var(--brand)}
.mode strong{font:700 17px var(--f-display)}
.mode span{font-size:13px;color:var(--muted)}
.mode em{font-style:normal;font:600 12px var(--f-mono);color:var(--brand)}
.sticky{position:sticky;top:84px}
.note{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;margin-top:14px}
.steps{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.steps b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface2);font:500 12px var(--f-mono)}
.steps .on{color:var(--brand)}.steps .on b{background:var(--brand);color:var(--brand-ink)}
.steps i{flex:0 0 28px;height:2px;background:var(--line)}

/* orders */
.olist{display:grid;gap:16px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.5vw,24px);box-shadow:var(--shadow)}
.otop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.otop h3{font-size:22px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink)}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.new{background:var(--warn-soft);color:var(--warn)}
.badge.accepted,.badge.ready{background:var(--brand-soft);color:var(--brand)}
.badge.done{background:var(--brand);color:var(--brand-ink)}
.badge.cancelled{background:var(--bad-soft);color:var(--bad)}
.track4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin:22px 0 8px;position:relative}
.ts{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;color:var(--muted);position:relative}
.ts:before{content:"";position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--line)}
.ts:first-child:before{display:none}
.ts.r:before{background:var(--brand);animation:grow .6s both;transform-origin:left}
.dot{z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:3px solid var(--line);font:500 11px var(--f-mono);color:var(--muted)}
.ts.r .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ts.cur .dot{box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 25%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--brand) 0%,transparent)}}
.ts.r{color:var(--ink);font-weight:600}
.oitems{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:grid;gap:8px;font-size:14px}
.oitems div{display:flex;justify-content:space-between;gap:12px}
.oinfo{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.oinfo b{color:var(--ink);font-weight:600}
.oact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* farmer */
.fhero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
.fhero h2{font-size:clamp(30px,4.4vw,50px);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stat strong{display:block;font:500 clamp(24px,3vw,34px) var(--f-mono);letter-spacing:-.04em;margin-top:6px}
.stat small{color:var(--muted);font-size:12px;font-weight:600}
.stat.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hot small{color:inherit;opacity:.75}
.ftabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:14px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.ftabs button{padding:9px 16px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.ftabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:18px;align-items:start}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) 92px 92px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow small{display:block;color:var(--muted)}
.prow input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font:500 14px var(--f-mono)}
.prow label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.pact{display:flex;gap:6px}
.bars{display:grid;gap:12px;margin-top:14px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.reqfilter{display:flex;gap:8px;margin-bottom:14px}
.mapwrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);cursor:crosshair}
.mapwrap svg{display:block;width:100%;height:auto}
.saved{display:grid;gap:8px;margin-top:14px}
.srow{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:13px}
.srow div{flex:1;min-width:0}
.srow small{display:block;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.saved{max-height:460px;overflow:auto;padding-right:2px}
.mlist .btn{justify-self:start}
/* toasts */
#toasts{position:fixed;z-index:120;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:550;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2) both;max-width:min(460px,100%)}
.toast.warn{background:var(--bad);color:#fff}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

@media (max-width:980px){.hero{grid-template-columns:1fr}.mapcard{position:static}.co{grid-template-columns:1fr}.sticky{position:static}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .nav{display:none}
  main{padding-bottom:110px}
  .tabbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:11px;font-weight:600;color:var(--muted);position:relative}
  .tabbar button.on{color:var(--brand)}
  .tabbar .ic{width:22px;height:22px}
  .tabbar .pill-n{position:absolute;top:4px;left:calc(50% + 6px)}
  .basketbtn span{display:none}
  .seg button{padding:7px 9px;font-size:12px}
  .brand span{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .art{height:98px;font-size:46px}.cbody{padding:12px}.card h4{font-size:16px}.price{font-size:18px}
  .buyrow{flex-wrap:wrap}.buyrow .link{display:none}
  .fgrid,.modes{grid-template-columns:1fr}
  .prow{grid-template-columns:44px minmax(0,1fr) 1fr 1fr;}
  .prow .pact{grid-column:1/-1;justify-content:flex-end}
  .ts{font-size:10px}
}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}.addbtn{padding:8px 12px}.hero h1{font-size:36px}.mrow{grid-template-columns:auto minmax(0,1fr)}.mrow .dist{grid-column:2;text-align:left}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

/* ===== public site additions ===== */
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:200;font-weight:600}
.skip:focus{left:12px}
.bellb{position:relative}
.bellb .pill-n{position:absolute;top:-6px;right:-6px}

.band{margin-top:64px}
.band>h2,.bandhead h2{font-size:clamp(26px,3.6vw,42px);font-weight:800;margin-bottom:8px}
.bandhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.sub{color:var(--muted);max-width:62ch}
.stats3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:44px;border-block:1px solid var(--line)}
.sn{padding:20px 8px 20px 0}
.sn+.sn{padding-left:22px;border-left:1px solid var(--line)}
.sn strong{display:block;font:500 clamp(28px,4vw,46px) var(--f-mono);letter-spacing:-.05em;color:var(--brand)}
.sn span{color:var(--muted);font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:18px}
.tile{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;display:grid;gap:4px;transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand)}
.tile .em{font-size:38px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.tile strong{font:700 18px var(--f-display)}
.tile small{color:var(--muted)}
.dealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.deal{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:transform .2s,box-shadow .2s;align-items:center}
.deal:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.deal .em{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:30px;background:var(--surface2)}
.deal strong{display:block;font:700 16px var(--f-display);overflow-wrap:anywhere}
.deal small{display:block;color:var(--muted);line-height:1.35}
.deal .pc{font:500 13px var(--f-mono);color:var(--brand)}
.hsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}
.hstep{padding:6px 0}
.hstep .n{font:500 14px var(--f-mono);color:var(--brand);display:block;margin-bottom:10px}
.hstep h3{font-size:22px;margin-bottom:8px}
.hstep p{color:var(--muted)}
.cta{margin-top:64px;background:var(--brand);color:var(--brand-ink);border-radius:28px;padding:clamp(24px,4vw,48px);display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.cta h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;max-width:20ch}
.cta p{opacity:.9;max-width:52ch;margin-top:10px}
.cta .btn{background:var(--accent);color:var(--accent-ink)}
.faq{margin-top:14px;max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font:700 18px var(--f-display);list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:500 24px var(--f-mono);color:var(--brand);flex:none}
.faq details[open] summary::after{content:"\2013"}
.faq details p{margin-top:10px;color:var(--muted);max-width:68ch}
.doc{max-width:760px}
.doc h3{margin:28px 0 8px;font-size:22px}
.doc p,.doc li{line-height:1.7;margin:0 0 12px}
.doc ul{padding-left:20px;margin:0 0 12px}
.doc .lead{font-size:18px;color:var(--muted)}
.orow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .2s,box-shadow .2s}
.orow:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.orow .lart{width:52px;height:52px;font-size:30px}
.orow strong{display:block;font:700 17px var(--f-display);overflow-wrap:anywhere}
.orow small{display:block;color:var(--muted);line-height:1.4}
.olistx{display:grid;gap:10px}
.rate{color:var(--warn);font-weight:700;font-size:12px;white-space:nowrap}
.stars{display:inline-flex;flex-direction:row-reverse;gap:2px;position:relative}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:28px;line-height:1;cursor:pointer;color:var(--line);transition:color .12s,transform .12s}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--accent)}
.stars label:hover{transform:scale(1.15)}
.stars input:focus-visible+label{outline:3px solid var(--accent);border-radius:6px}
.rvrow{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rvrow .st{color:var(--accent);letter-spacing:2px}
.rvfield{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.rvfield:last-of-type{border:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}

.chk .link{font-size:inherit}
.cookie{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ink);color:var(--bg);padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.cookie .wrap{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}

.fcols .fl{display:grid;gap:8px;justify-items:start}
.fcols .fl button,.fcols .fl a{color:var(--muted);font-size:14px;text-align:left;padding:0}

.fbrand p{margin-top:12px;max-width:34ch;font-size:14px}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}
.foot{padding-block:44px 28px}

.badge.ok{background:var(--brand-soft);color:var(--brand)}

textarea.copybox{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font:13px/1.5 var(--f-mono);margin-top:12px}

@media (max-width:980px){.fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.fbrand{grid-column:1/-1}.sellgrid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.stats3{grid-template-columns:repeat(2,minmax(0,1fr))}.sn:nth-child(3){padding-left:0;border-left:0}.sn:nth-child(n+3){border-top:1px solid var(--line)}.hsteps{grid-template-columns:1fr}}

/* auth + farmer portal */
:root{--fp-bg:#123a24;--fp-ink:#eaf6e6;--fp-mute:#a9c9b1;--fp-line:#2c5a3d;--fp-card:#1b4b30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fp-bg:#0f2b1a;--fp-ink:#e7f1e4;--fp-mute:#93b59c;--fp-line:#27402d;--fp-card:#173a25}}
:root[data-theme="dark"]{--fp-bg:#0f2b1a;--fp-ink:#e7f1e4;--fp-mute:#93b59c;--fp-line:#27402d;--fp-card:#173a25}
.authgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,56px);align-items:start;max-width:1040px;margin:12px auto 0}
.authside h2{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1;margin:12px 0 26px}
.authside .perks{display:grid;gap:18px}
.authcard{max-width:560px;width:100%}
.authcard .ftabs{margin-bottom:18px}
.pwrow{position:relative;display:flex}
.pwrow input{padding-right:70px!important}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700;color:var(--brand)}
.pwtoggle:hover{background:var(--brand-soft)}
.authlinks{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.authlinks .link{font-size:13px}
.swap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.userchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-weight:650;font-size:14px}
.userchip:hover{border-color:var(--brand)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font:700 14px var(--f-display)}
.portal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(18px,3vw,36px);align-items:start;max-width:1100px;margin:12px auto 0}
.fp{background:var(--fp-bg);color:var(--fp-ink);border-radius:28px;padding:clamp(24px,4vw,44px);position:relative;overflow:hidden}
.fp:after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%);pointer-events:none}
.fp .eyebrow{color:var(--accent)}
.fp h2{font-size:clamp(30px,4.2vw,48px);font-weight:800;line-height:1.02;margin:12px 0 14px}
.fp p{color:var(--fp-mute);max-width:46ch}
.idcard{margin:26px 0;max-width:340px;padding:18px 20px;border-radius:18px;background:linear-gradient(135deg,var(--fp-card),var(--fp-bg));border:1px solid var(--fp-line);transform:rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.28);animation:floaty 5s ease-in-out infinite}
.idcard small{font:600 10px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--fp-mute)}
.idcard .no{font:600 clamp(22px,3vw,28px) var(--f-mono);letter-spacing:.06em;margin:10px 0 14px;color:var(--accent)}
.idcard .row{display:flex;justify-content:space-between;font-size:12px;color:var(--fp-mute)}
@keyframes floaty{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.idcard{animation:none}}
.fplist{list-style:none;display:grid;gap:10px;position:relative;z-index:1}
.fplist li{padding-left:26px;position:relative;font-size:15px}

/* leaf-corner shapes tie every surface together */
.card{border-radius:24px 24px 24px 6px}
.panel,.ocard,.board{border-radius:24px 24px 24px 8px}
.mapcard{border-radius:28px 28px 28px 8px}
.cta{border-radius:30px 90px 30px 90px;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.13) 0 60px,transparent 61px),radial-gradient(circle at 88% 85%,rgba(242,181,29,.28) 0 110px,transparent 111px),var(--brand)}
.mrow{border-radius:18px 18px 18px 6px}
.band>h2:before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.35em;border-radius:0 80% 0 80%;background:linear-gradient(135deg,var(--lime),var(--leaf));transform:rotate(-8deg);vertical-align:.02em}
.hero h1 em:after{background:linear-gradient(90deg,var(--accent),var(--mango))}
/* motion */
.brand .ic{animation:fcsway 5s ease-in-out infinite;transform-origin:50% 100%}
.art span{animation:fcbob 5.5s ease-in-out infinite}
.card:nth-child(2n) .art span{animation-delay:-1.4s}.card:nth-child(3n) .art span{animation-delay:-2.8s}
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);transition:left .6s}
.btn:hover:after{left:130%}
.card{--rx:0deg;--ry:0deg;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry))}
.card:hover{transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px)}
.mnum{background:linear-gradient(135deg,var(--leaf),var(--brand))}
.pin .drop path{filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.bcol,.stat,.tile{transition:transform .25s}
.bcol:hover,.stat:hover{transform:translateY(-3px)}
/* scroll reveal (only when script is running) */
html.fc-js .fc-rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0)*90ms)}
html.fc-js .fc-rv.fc-in{opacity:1;transform:none}
@media (max-width:720px){.fcscene{height:260px}.fcfloat{font-size:26px}.fcfloat.hm{display:none}}

.fcscene{display:none!important}
.fcbg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fcbg svg{position:absolute;inset:0;width:100%;height:100%}
.fcbg .fx{opacity:.7;font-size:38px}
.fcbg .cloud2{animation:fcpan 16s ease-in-out infinite alternate}
.fcbg .cloud2.b{animation-duration:22s;animation-delay:-8s}

/* top bar: floating glass pill with a colour strip */

.top .topin{position:relative;width:calc(100% - 24px);max-width:1176px;margin:0 auto;padding-left:14px;padding-right:14px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:24px 24px 24px 8px;box-shadow:var(--shadow);transition:height .3s,box-shadow .3s}

.nav button.on{background:linear-gradient(135deg,var(--brand-soft),var(--lime-soft));color:var(--brand);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 25%,transparent)}
.basketbtn{background:linear-gradient(135deg,var(--accent),var(--mango));box-shadow:0 6px 16px color-mix(in srgb,var(--mango) 35%,transparent);border-radius:14px}
.top .btn.sm:not(.ghost){background:linear-gradient(135deg,var(--leaf),var(--brand))}

/* ===== cards, bottom bar, footer and finishing touches ===== */
/* vegetable cards */
.card{border-top:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c,#7bc47f) 10%,var(--surface)) 0,var(--surface) 48%);box-shadow:0 1px 2px rgba(19,40,28,.05);position:relative}
.card:hover{box-shadow:0 18px 40px color-mix(in srgb,var(--c,#7bc47f) 30%,transparent);border-color:color-mix(in srgb,var(--c,#7bc47f) 55%,var(--line))}

/* market cards */
