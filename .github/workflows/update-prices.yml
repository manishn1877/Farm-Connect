
name: Update daily mandi prices

on:
  schedule:
    - cron: "40 5 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official mandi prices
        shell: bash
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python scripts/fetch_prices.py

      - name: Commit updated prices
        shell: bash
        run: |
          git config user.name "farmconnect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/board.json
          if ! git diff --cached --quiet; then
            git commit -m "Update mandi prices"
            git push
          else
            echo "No price changes."
          fi
