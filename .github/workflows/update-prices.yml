name: Update daily mandi prices

on:
  schedule:
    - cron: "40 5 * * *"    # 11:10 IST, mandi data for the day is usually in by then
    - cron: "40 13 * * *"   # 19:10 IST, catches late uploads
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "farmconnect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/board.json data/board.json
          git diff --cached --quiet && echo "No change" || (git commit -m "Update mandi prices" && git push)
