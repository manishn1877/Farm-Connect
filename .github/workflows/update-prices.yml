
name: Update daily mandi prices

on:
  schedule:
    - cron: "40 5 * * *"
    - cron: "40 9 * * *"
    - cron: "40 13 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official mandi prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit updated prices
        shell: pwsh
        run: |
          git config user.name "farmconnect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/board.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Update mandi prices"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          elseif ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          else {
            Write-Host "No price changes."
          }
